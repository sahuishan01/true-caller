name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Run automated test suite
        run: bun test

      - name: Compile production build
        run: bun run build

      - name: CLI smoke test
        run: bun run core/cli/run_node.ts

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truecalling-dist
          path: dist/
          retention-days: 7

  release:
    name: GitHub Release
    needs: [test-and-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile production build
        run: bun run build

      - name: Package release archive
        run: |
          tar -czvf truecalling-${{ github.ref_name }}.tar.gz dist/ core/ platform/ ui/ package.json README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TrueCalling ${{ github.ref_name }}
          files: truecalling-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
